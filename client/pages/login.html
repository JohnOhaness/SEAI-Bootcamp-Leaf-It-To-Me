<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Leaf It To Me</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <script src="../scripts/auth.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="nav-brand"
          ><img
            src="../images/leaf-logo.png"
            alt="Leaf It To Me logo"
            class="nav-logo"
          /><span class="nav-title">Leaf It To Me</span></a
        >
        <ul class="nav-links">
          <li><a href="create-listing.html">Create</a></li>
          <li><a href="find-listing.html">Find</a></li>
          <li><a href="login.html" class="active">Login</a></li>
          <li><a href="signup.html">Sign Up</a></li>
        </ul>
      </nav>
    </header>
    <main class="page-shell auth-page">
      <div class="card form-card auth-card">
        <h1>Log in</h1>
        <p id="login-message" class="form-message" role="status"></p>
        <form id="login-form">
          <div>
            <label for="username">Username</label
            ><input type="text" id="username" name="username" required />
          </div>
          <div>
            <label for="password">Password</label
            ><input type="password" id="password" name="password" required />
          </div>
          <button type="submit">Log in</button>
          <p class="auth-switch">
            No account? <a href="signup.html">Sign up</a>
          </p>
        </form>
      </div>
    </main>
    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const messageEl = document.getElementById("login-message");
          messageEl.textContent = "";
          postForm("../../server/login.php", {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          })
            .then(function (response) {
              if (response.success) {
                setSession(response.data.token, response.data.username);
                messageEl.textContent = "Logged in. Redirecting…";
                messageEl.className = "form-message form-success";
                setTimeout(function () {
                  location.href = "../index.html";
                }, 800);
              } else {
                messageEl.textContent = response.error || "Login failed";
                messageEl.className = "form-message form-error";
              }
            })
            .catch(function () {
              messageEl.textContent = "Could not reach the server";
              messageEl.className = "form-message form-error";
            });
        });
    </script>
    <footer class="site-footer">
      <div class="footer-content">
        <p class="footer-copyright">
          &copy; 2026 Leaf It To Me. All rights reserved.
        </p>
        <div class="footer-socials">
          <a
            href="https://instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          ><a
            href="https://facebook.com"
            target="_blank"
            rel="noopener noreferrer"
            >Facebook</a
          ><a
            href="https://tiktok.com"
            target="_blank"
            rel="noopener noreferrer"
            >TikTok</a
          >
        </div>
      </div>
    </footer>
  </body>
</html>
