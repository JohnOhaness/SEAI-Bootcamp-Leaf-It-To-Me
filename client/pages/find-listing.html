<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find a Sit | Leaf It To Me</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <script src="../scripts/auth.js"></script>
    <script defer src="../scripts/listings.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="nav-brand"
          ><img
            src="../images/leaf-logo.png"
            alt="Leaf It To Me logo"
            class="nav-logo"
          /><span class="nav-title">Leaf It To Me</span></a
        >
        <ul class="nav-links">
          <li><a href="create-listing.html">Create</a></li>
          <li><a href="find-listing.html" class="active">Find</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="signup.html">Sign Up</a></li>
        </ul>
      </nav>
    </header>
    <main class="page-shell">
      <!-- <section class="page-intro">
        <p class="eyebrow">OPEN ASSIGNMENTS</p>
        <h1>Plants looking for a little company.</h1>
        <p>
          Claiming is first come, first served. Read the care notes, then make
          your mark.
        </p>
      </section> -->
      <section class="filter-bar card">
        <div class="filter-heading">
          <p class="eyebrow">FILTERS:</p>
        </div>
        <div class="filter-field">
          <label for="filter-region">District</label
          ><select id="filter-region">
            <option value="">All districts</option>
            <option>Beirut</option>
            <option>Metn</option>
            <option>Keserwan</option>
            <option>Baabda</option>
            <option>Aley</option>
            <option>Chouf</option>
            <option>Tripoli</option>
            <option>Zahle</option>
            <option>Saida</option>
            <option>Tyre</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-proximity">Distance</label
          ><select id="filter-proximity">
            <option value="any">Everywhere</option>
            <option value="same">Same district</option>
            <option value="nearby">Nearby districts</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-sort">Order</label
          ><select id="filter-sort">
            <option value="soonest">Starting soonest</option>
            <option value="recent">Most recently listed</option>
          </select>
        </div>
        <button id="apply-filter" class="btn btn-primary" type="button">
          Apply filters
        </button>
      </section>
      <p id="listing-message" class="status-message" role="status"></p>
      <section id="listing-grid" class="listing-grid" aria-live="polite">
        <div class="empty-state">Loading listings…</div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-content">
        <p class="footer-copyright">
          &copy; 2026 Leaf It To Me. All rights reserved.
        </p>
        <div class="footer-socials">
          <a
            href="https://instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          ><a
            href="https://facebook.com"
            target="_blank"
            rel="noopener noreferrer"
            >Facebook</a
          ><a
            href="https://tiktok.com"
            target="_blank"
            rel="noopener noreferrer"
            >TikTok</a
          >
        </div>
      </div>
    </footer>
  </body>
</html>
