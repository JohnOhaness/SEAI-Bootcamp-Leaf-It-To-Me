<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Leaf It To Me</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <script src="../scripts/auth.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="nav-brand"
          ><img
            src="../images/leaf-logo.png"
            alt="Leaf It To Me logo"
            class="nav-logo"
          /><span class="nav-title">Leaf It To Me</span></a
        >
        <ul class="nav-links">
          <li><a href="create-listing.html">Create</a></li>
          <li><a href="find-listing.html">Find</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="signup.html" class="active">Sign Up</a></li>
        </ul>
      </nav>
    </header>
    <main class="page-shell auth-page">
      <div class="card form-card auth-card">
        <h1>Sign up</h1>
        <p id="signup-message" class="form-message" role="status"></p>
        <form id="signup-form">
          <div>
            <label for="username">Username</label
            ><input type="text" id="username" name="username" required />
          </div>
          <div>
            <label for="email">Email</label
            ><input type="email" id="email" name="email" required />
          </div>
          <div>
            <label for="password">Password</label
            ><input type="password" id="password" name="password" required />
          </div>
          <div>
            <label for="region">Lebanese district</label
            ><select id="region" name="region" required>
              <option value="">Choose your district</option>
              <option>Beirut</option>
              <option>Metn</option>
              <option>Keserwan</option>
              <option>Baabda</option>
              <option>Aley</option>
              <option>Chouf</option>
              <option>Tripoli</option>
              <option>Zahle</option>
              <option>Saida</option>
              <option>Tyre</option>
            </select>
          </div>
          <button type="submit">Sign up</button>
          <p class="auth-switch">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </form>
      </div>
    </main>
    <script>
      document
        .getElementById("signup-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const messageEl = document.getElementById("signup-message");
          messageEl.textContent = "";
          postForm("../../server/signup.php", {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            region: document.getElementById("region").value,
          })
            .then(function (res) {
              if (res.success) {
                messageEl.textContent =
                  "Account created! Redirecting to login...";
                messageEl.className = "form-message form-success";
                setTimeout(function () {
                  location.href = "login.html";
                }, 1000);
              } else {
                messageEl.textContent = res.error || "Sign up failed";
                messageEl.className = "form-message form-error";
              }
            })
            .catch(function () {
              messageEl.textContent = "Could not reach the server";
              messageEl.className = "form-message form-error";
            });
        });
    </script>
    <footer class="site-footer">
      <div class="footer-content">
        <p class="footer-copyright">
          &copy; 2026 Leaf It To Me. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
