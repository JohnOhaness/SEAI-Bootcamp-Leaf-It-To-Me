<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaf It To Me - Sign Up</title>
    <link rel="stylesheet" href="/client/styles/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="/client/index.html" class="nav-brand">
          <img
            src="/client/assets/logo-placeholder.png"
            alt="Leaf It To Me logo"
            class="nav-logo"
          />
          <span class="nav-title">Leaf It To Me</span>
        </a>

        <ul class="nav-links">
          <li><a href="/client/pages/create-listing.html">Create</a></li>
          <li><a href="/client/pages/find-listing.html">Find</a></li>
          <li><a href="/client/pages/login.html">Login</a></li>
          <li>
            <a href="/client/pages/signup.html" class="active">Sign Up</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div>
        <h1>Sign Up</h1>
        <form>
          <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-content">
        <p class="footer-copyright">
          &copy; 2026 Leaf It To Me. All rights reserved.
        </p>

        <div class="footer-socials">
          <a
            href="https://instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          >
          <a
            href="https://facebook.com"
            target="_blank"
            rel="noopener noreferrer"
            >Facebook</a
          >
          <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer"
            >TikTok</a
          >
        </div>
      </div>
    </footer>
  </body>
</html>
